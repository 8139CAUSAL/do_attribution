[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "do-attribution"
version = "0.0.2"
description = "Unified multi-touch attribution library (Markov chain + Shapley value)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Aaron Goodin", email = "goodinaaron@causalscience.com" },
]
keywords = [
    "attribution",
    "marketing",
    "markov",
    "shapley",
    "multi-touch",
    "analytics",
    "incrementality",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.3.0", "networkx>=2.5"]
temporal = ["statsmodels>=0.14", "ruptures>=1.1"]
excel = ["openpyxl>=3.0.0"]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.3.0",
    "networkx>=2.5",
    "openpyxl>=3.0.0",
    "statsmodels>=0.14",
    "ruptures>=1.1",
]

[tool.setuptools.packages.find]
include = ["do_attribution*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    # Suppress the deliberate "empty path" warnings emitted during validation.
    "ignore:Found .* empty paths",
    "ignore:Total Shapley value is zero",
]
